name: Build PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Compile LaTeX
      uses: xu-cheng/latex-action@v3
      with:
        root_file: main.tex
        latexmk_use_xelatex: true
        pre_compile: |
          apk add --no-cache fontconfig ttf-dejavu
          fc-cache -fv

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: bridge-system
        path: main.pdf

    # Автоматический релиз при пуше в main
    - name: Get date
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      id: date
      run: echo "date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Create Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ steps.date.outputs.date }}
        name: "PDF ${{ steps.date.outputs.date }}"
        files: main.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Подготовка артефакта для Pages
    - name: Prepare Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        mkdir -p _site
        cp main.pdf _site/bridge.pdf
        cat > _site/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <title>Bridge 2/1 System</title>
          <style>body{margin:0;} iframe{width:100%;height:100vh;border:none;}</style>
        </head>
        <body>
          <iframe src="bridge.pdf"></iframe>
        </body>
        </html>
        EOF

    - name: Upload Pages artifact
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  # Отдельный job для деплоя — требование GitHub Pages
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
